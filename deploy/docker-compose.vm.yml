name: blind-box

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: blind-box-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MONGODB_URI: mongodb://mongo-shared:27017/blindbox
    networks:
      - vm_shared

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SOCKET_URL: /
    container_name: blind-box-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vm_shared

  nginx:
    image: nginx:1.27-alpine
    container_name: blind-box-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vm_shared

networks:
  vm_shared:
    name: vm-shared
    external: true